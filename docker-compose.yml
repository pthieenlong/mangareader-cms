version: "3.8"

services:
  cms:
    image: ghcr.io/pthieenlong/mangareader-cms:${IMAGE_TAG:-dev}
    container_name: mangareader-cms
    pull_policy: always
    ports:
      - "5173:5173"
    networks:
      - datn_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  datn_network:
    external: true
